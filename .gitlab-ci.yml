stages:
  - lint
  - test
  - build

default:
  image: node:22-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .pnpm-store/

lint:
  stage: lint
  script:
    - pnpm run lint

test:
  stage: test
  script:
    - pnpm test

# firestore.rules est la seule protection des données (pas de backend) : ses tests bloquent la CI.
rules:
  stage: test
  script:
    - apk add --no-cache openjdk17-jre-headless
    - npm install -g firebase-tools@13.35.1
    - pnpm run test:rules

audit:
  stage: test
  script:
    - pnpm audit --prod
  allow_failure: true

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
