stages:
  - lint
  - test
  - build

default:
  image: node:20-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .pnpm-store/

lint:
  stage: lint
  script:
    - pnpm run lint

test:
  stage: test
  script:
    - pnpm test

audit:
  stage: test
  script:
    - pnpm audit --prod
  allow_failure: true

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
