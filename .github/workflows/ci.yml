name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mêmes étapes que `make ci`
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4 # émulateur Firestore
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: npm install -g firebase-tools@13.35.1
      - run: pnpm run lint
      - run: pnpm test
      # firestore.rules est la seule protection des données (pas de backend) : ses tests bloquent la CI
      - run: pnpm run test:rules
      - run: pnpm run build
      - run: pnpm audit --prod --audit-level high
